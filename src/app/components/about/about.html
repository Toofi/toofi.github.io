<div class="section-header" id="about" appReveal>
  <span class="section-header-label">{{ t().sectionLabel }}</span>
  <span class="section-header-count">001</span>
</div>
<div class="section-body">
  <div class="about-layout" appReveal>
    <div class="about-title-col">
      <h2 [innerHTML]="t().titleHtml"></h2>
    </div>
    <div class="about-text-col">
      <p [innerHTML]="t().p1Html"></p>
      <p [innerHTML]="t().p2Html"></p>
      <p [innerHTML]="t().p3Html"></p>
      <div class="values-grid">
        @for (value of t().values; track value.n) {
          <div class="value-item">
            <span class="value-n">{{ value.n }}</span>
            {{ value.label }}
          </div>
        }
      </div>
    </div>
  </div>
</div>
