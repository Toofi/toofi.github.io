<div class="section-header" id="contact" appReveal>
  <span class="section-header-label">Contact</span>
  <span class="section-header-count">005</span>
</div>
<div class="section-body">
  <div class="contact-layout" appReveal>
    <div class="contact-left">
      <h2>Travaillons<br /><em>ensemble!</em></h2>
      <p>
        Disponible pour des missions freelance, du consulting technique ou des collaborations
        long terme. Basé à Mouscron, Belgique. Réponse sous 24h.
      </p>
      <div class="contact-links">
        @for (link of contactLinks; track link.href) {
          <a
            class="contact-link"
            [href]="link.href"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noopener' : null"
          >
            <span>{{ link.label }}</span>
            <span>↗</span>
          </a>
        }
      </div>
    </div>
    <div class="contact-right">
      <h3>Envoyer un message</h3>
      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label class="form-label" for="contact-name">Nom</label>
          <input
            id="contact-name"
            class="form-input"
            type="text"
            name="name"
            placeholder="Jean Dupont"
            [(ngModel)]="name"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-email">Email</label>
          <input
            id="contact-email"
            class="form-input"
            type="email"
            name="email"
            placeholder="jean@startup.fr"
            [(ngModel)]="email"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-message">Message</label>
          <textarea
            id="contact-message"
            class="form-input"
            name="message"
            placeholder="Décrivez votre projet..."
            [(ngModel)]="message"
          ></textarea>
        </div>
        <button type="submit" class="form-submit">Envoyer →</button>
      </form>
    </div>
  </div>
</div>
