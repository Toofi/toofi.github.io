<div class="section-header" id="contact" appReveal>
  <span class="section-header-label">{{ t().sectionLabel }}</span>
  <span class="section-header-count">005</span>
</div>
<div class="section-body">
  <div class="contact-layout" appReveal>
    <div class="contact-left">
      <h2 [innerHTML]="t().titleHtml"></h2>
      <p>{{ t().description }}</p>
      <div class="contact-links">
        @for (link of contactLinks; track $index; let i = $index) {
          <a
            class="contact-link"
            [class.is-protected]="link.kind === 'protected' && !isRevealed(i)"
            [attr.href]="hrefFor(link, i)"
            [attr.target]="link.kind === 'public' && link.external ? '_blank' : null"
            [attr.rel]="link.kind === 'public' && link.external ? 'noopener' : null"
            [attr.aria-label]="ariaLabel(link, i)"
            [attr.role]="link.kind === 'protected' && !isRevealed(i) ? 'button' : null"
            (click)="onContactClick($event, link, i)"
          >
            <span>{{ displayLabel(link, i) }}</span>
            <span>{{ link.kind === 'protected' && !isRevealed(i) ? '👁' : '↗' }}</span>
          </a>
        }
      </div>
    </div>
    <div class="contact-right">
      <h3>{{ t().formTitle }}</h3>
      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label class="form-label" for="contact-name">{{ t().nameLabel }}</label>
          <input
            id="contact-name"
            class="form-input"
            type="text"
            name="name"
            [placeholder]="t().namePlaceholder"
            [(ngModel)]="name"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-email">{{ t().emailLabel }}</label>
          <input
            id="contact-email"
            class="form-input"
            type="email"
            name="email"
            [placeholder]="t().emailPlaceholder"
            [(ngModel)]="email"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-message">{{ t().messageLabel }}</label>
          <textarea
            id="contact-message"
            class="form-input"
            name="message"
            [placeholder]="t().messagePlaceholder"
            [(ngModel)]="message"
          ></textarea>
        </div>
        <button type="submit" class="form-submit">{{ t().submit }}</button>
      </form>
    </div>
  </div>
</div>
