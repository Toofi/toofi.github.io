<div class="section-header" id="experience" appReveal>
  <span class="section-header-label">Expériences</span>
  <span class="section-header-count">002</span>
</div>
<div class="section-body">
  @for (xp of experiences; track xp.title) {
    <div
      class="xp-item"
      appReveal
      [class.reveal-delay-1]="xp.delay === 1"
      [class.reveal-delay-2]="xp.delay === 2"
    >
      <div class="xp-meta">
        <div class="xp-date">{{ xp.date }}</div>
        <div class="xp-sector">{{ xp.sector }}</div>
        <div class="xp-type">{{ xp.type }}</div>
      </div>
      <div class="xp-content">
        <h3>{{ xp.title }}</h3>
        <p [innerHTML]="xp.description"></p>
        <div class="xp-tags">
          @for (tag of xp.tags; track tag) {
            <span class="tag">{{ tag }}</span>
          }
        </div>
      </div>
    </div>
  }
</div>
