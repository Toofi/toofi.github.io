<header class="site-header">
  <div class="topbar">
    <a href="#top" class="topbar-logo" (click)="goToTop($event)">TOOFI<span>.</span>DEV</a>
    <button
      class="lang-switch"
      type="button"
      [attr.aria-label]="'Switch to ' + switchLabel()"
      (click)="toggleLang()"
    >
      <span>{{ switchLabel() }}</span>
    </button>
  </div>
  <nav class="navbar">
    <ul class="nav-links">
      @for (link of links; track link.href) {
        <li>
          <a
            [href]="'#' + link.href"
            [class.active]="activeSection() === link.href"
            (click)="scrollTo($event, link.href)"
            >{{ link.label[lang()] }}</a
          >
        </li>
      }
    </ul>
    <span class="nav-avail">{{ availLabel() }}</span>
  </nav>
</header>
