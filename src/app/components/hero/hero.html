<div class="hero-wrap">
  <div class="hero-header">
    <span class="hero-header-label">{{ t().headerLabel }}</span>
    <span class="hero-header-date">{{ t().date }}</span>
  </div>
  <div class="hero-body">
    <div class="hero-left">
      <div>
        <div class="hero-eyebrow">{{ t().eyebrow }}</div>
        <h1 class="hero-name">Quentin<br /><em>Herpoel</em></h1>
        <div class="hero-rule"></div>
        <p class="hero-tagline" [innerHTML]="t().taglineHtml"></p>
      </div>
      <div class="hero-ctas">
        <a href="#contact" class="btn-primary">{{ t().ctaPrimary }}</a>
        <a href="#experience" class="btn-ghost">{{ t().ctaGhost }}</a>
      </div>
    </div>
    <div class="hero-right">
      <div class="hero-photo-zone">
        <img src="hero-photo.jpg" [alt]="t().photoAlt" />
        <div class="hero-photo-overlay"></div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="stat-num">5<em>+</em></div>
          <div class="stat-label">{{ t().stat1Label }}</div>
        </div>
        <div class="hero-stat">
          <div class="stat-num">C#<em>/</em>Typescript</div>
          <div class="stat-label">{{ t().stat2Label }}</div>
        </div>
        <div class="hero-stat">
          <div class="stat-num">∞</div>
          <div class="stat-label">{{ t().stat3Label }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
